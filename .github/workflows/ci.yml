name: Verify workflow packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[aws]'
      - run: python -m unittest discover -s tests -v
      - run: python -m gtm_starter
      - run: python scripts/check_setup.py --init --mode local
  slack-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r reference/slack-agentcore/requirements.txt
      - run: python -m unittest discover -s reference/slack-agentcore/tests -v
        env:
          PYTHONPATH: reference/slack-agentcore/src
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-2
